[Service]
# sg docker 启 uvicorn 时，旧进程偶发残留占 8000；启停前后清掉
ExecStartPre=-/bin/bash -c 'fuser -k 8000/tcp >/dev/null 2>&1 || true; pkill -f "uvicorn app.main:app" >/dev/null 2>&1 || true; sleep 1'
ExecStopPost=-/bin/bash -c 'pkill -f "uvicorn app.main:app" >/dev/null 2>&1 || true'
TimeoutStopSec=15
KillMode=control-group
